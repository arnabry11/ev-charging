name: CI

on:
  push:
  pull_request:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - name: Check gateway health
        run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 --silent --show-error http://127.0.0.1:8080/health
      - name: Check platform health
        run: curl --fail --retry 30 --retry-all-errors --retry-delay 2 --silent --show-error http://127.0.0.1:3000/health
      - name: Wait for demo charger
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/internal/v1/chargers/CHG-MUM-0001 | grep -q '"connection_state":"connected"'; then
              exit 0
            fi
            sleep 2
          done
          echo "charger did not connect"
          docker compose logs gateway simulator
          exit 1
      - name: Run session scenarios
        run: |
          ./scripts/payment-declined.sh
          ./scripts/event-order.sh
          ./scripts/demo-session.sh energy
          ./scripts/demo-session.sh duration
          ./scripts/prepay-session.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  gateway-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check generated SQL code
        run: |
          docker run --rm -v "$PWD/gateway:/src" -w /src sqlc/sqlc:1.30.0 generate
          git diff --exit-code -- gateway/internal/store
          test -z "$(git status --porcelain --untracked-files=all -- gateway/internal/store)"
      - name: Test gateway image
        run: docker build --target build -t ev-gateway-test ./gateway
      - run: cp .env.example .env
      - name: Start and migrate gateway database
        run: |
          docker compose up -d --wait gateway-db
          docker compose run --rm gateway-migrate
      - name: Run gateway database integration tests
        run: >-
          docker run --rm
          --network ev-charging_default
          -e TEST_DATABASE_URL=postgres://ev:ev@gateway-db:5432/ev_gateway?sslmode=disable
          ev-gateway-test
          go test -race -p 1 ./internal/store ./internal/session
      - if: always()
        run: docker compose down -v

  simulator-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test simulator image
        run: docker build --target build -t ev-simulator-test ./simulator

  platform-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose up --build -d platform-db redis
      - name: Run RSpec
        run: >-
          docker compose run --rm
          -e RAILS_ENV=test
          -e DATABASE_URL=postgres://${POSTGRES_USER:-ev}:${POSTGRES_PASSWORD:-ev}@platform-db:5432/ev_platform_test
          platform bundle exec rspec
      - name: RuboCop
        run: docker compose run --rm -e SKIP_DB_PREPARE=1 platform bundle exec rubocop
      - if: always()
        run: docker compose down -v
