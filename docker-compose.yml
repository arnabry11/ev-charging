services:
  gateway:
    build: ./gateway
    environment:
      PORT: "8080"
      OCPP_PORT: "9000"
      HEARTBEAT_INTERVAL_S: "10"
      CHARGER_AUTH: ${CHARGER_AUTH:-CHG-MUM-0001:demo-password}
      DATABASE_URL: postgres://${POSTGRES_USER:-ev}:${POSTGRES_PASSWORD:-ev}@gateway-db:5432/${GATEWAY_DB:-ev_gateway}?sslmode=disable
      PLATFORM_SIGNING_SECRET: ${PLATFORM_SIGNING_SECRET:-dev-platform-secret}
      GATEWAY_SIGNING_SECRET: ${GATEWAY_SIGNING_SECRET:-dev-gateway-secret}
      PLATFORM_EVENTS_URL: ${PLATFORM_EVENTS_URL:-}
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
      - "${GATEWAY_OCPP_PORT:-9000}:9000"
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully

  gateway-migrate:
    image: migrate/migrate:v4.19.1
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-ev}:${POSTGRES_PASSWORD:-ev}@gateway-db:5432/${GATEWAY_DB:-ev_gateway}?sslmode=disable
      - up
    volumes:
      - ./gateway/db/migrations:/migrations:ro
    depends_on:
      gateway-db:
        condition: service_healthy

  simulator:
    build: ./simulator
    environment:
      CHARGER_ID: ${CHARGER_ID:-CHG-MUM-0001}
      CHARGER_PASSWORD: ${CHARGER_PASSWORD:-demo-password}
      GATEWAY_URL: ws://gateway:9000
      HTTP_ADDR: ":8081"
      SIM_POWER_W: ${SIM_POWER_W:-7200}
      SIM_METER_START_WH: ${SIM_METER_START_WH:-100000}
      SIM_TICK_INTERVAL_MS: ${SIM_TICK_INTERVAL_MS:-1000}
      SIM_SECONDS_PER_TICK: ${SIM_SECONDS_PER_TICK:-60}
    ports:
      - "${SIMULATOR_HTTP_PORT:-8081}:8081"
    depends_on:
      gateway:
        condition: service_healthy

  platform:
    build: ./platform
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-ev}:${POSTGRES_PASSWORD:-ev}@platform-db:5432/${PLATFORM_DB:-ev_platform}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-insecure-secret-key-base-for-compose-only}
      PORT: "3000"
    ports:
      - "${PLATFORM_HTTP_PORT:-3000}:3000"
    depends_on:
      platform-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  platform-worker:
    build: ./platform
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    healthcheck:
      disable: true
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-ev}:${POSTGRES_PASSWORD:-ev}@platform-db:5432/${PLATFORM_DB:-ev_platform}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-insecure-secret-key-base-for-compose-only}
    depends_on:
      platform-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ev}
      POSTGRES_DB: ${GATEWAY_DB:-ev_gateway}
    ports:
      - "${GATEWAY_DB_PORT:-5433}:5432"
    volumes:
      - gateway_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ev}
      POSTGRES_DB: ${PLATFORM_DB:-ev_platform}
    ports:
      - "${PLATFORM_DB_PORT:-5434}:5432"
    volumes:
      - platform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gateway_pg_data:
  platform_pg_data:
  redis_data:
